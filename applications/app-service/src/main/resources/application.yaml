server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

spring:
  application:
    name: "requests"
  devtools:
    add-properties: false

management:
  endpoints:
    web:
      base-path: ${SERVER_ACTUATOR_PATH}
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

adapters:
  r2dbc:
    host: ${SPRING_R2DBC_HOST_REQUEST}
    port: ${SPRING_R2DBC_PORT_REQUEST}
    database: ${SPRING_R2DBC_DATABASE_REQUEST}
    schema: ${SPRING_R2DBC_SCHEMA_REQUEST}
    username: ${SPRING_R2DBC_USERNAME_REQUEST}
    password: ${SPRING_R2DBC_PASSWORD_REQUEST}

adapter:
  restconsumer:
    timeout: ${RESTCONSUMER_TIMEOUT}
    url: ${AUTH_SERVICE_URL}

  sqs:
    region: ${AWS_REGION}
    queueUrl: ${AWS_SQS_LOAN_DECISION_URL}
    capacityValidationQueueUrl: ${AWS_SQS_CAPACITY_VALIDATION_QUEUE_URL}
    approvedLoanQueueUrl: ${AWS_SQS_APPROVED_LOAN_QUEUE_URL}

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"

springdoc:
  swagger-ui:
    path: "/request/api/doc/swagger-ui.html"
  api-docs:
    path: "/request/api/doc/api-docs"

routes:
  paths:
    loans: "/request/api/v1/loans"
    loansForReview: "/request/api/v1/loansForReview"
    loanDecision: "/request/api/v1/loans/{id}/decision"

security:
  jwt:
    keys:
      public: ${JWT_PUBLIC_KEY}

entrypoint:
  sqs:
    region: ${AWS_REGION}
    queueUrl: ${AWS_SQS_CAPACITY_VALIDATION_RESPONSE_QUEUE_URL}
    waitTimeSeconds: ${AWS_SQS_WAIT_TIME_SECONDS}
    maxNumberOfMessages: ${AWS_SQS_MAX_MESSAGES}
    visibilityTimeoutSeconds: ${AWS_SQS_VISIBILITY_TIMEOUT}
    numberOfThreads: ${AWS_SQS_THREADS}